# Repository settings applied by the GitHub Settings app.
# Branch protection for main: no change is merged without review and
# without the ci workflow passing (QMS section 4, change management).
repository:
  name: PatientTriage
  default_branch: main
  allow_merge_commit: false
  allow_squash_merge: true
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        contexts:
          - backend-tests
          - frontend-build
      enforce_admins: true
      required_linear_history: true
      restrictions: null
